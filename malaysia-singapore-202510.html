<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新馬五日遊 12/25-12/29</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#fff; --ink:#2b2b2b; --sub:#6b6b6b;
    --accent:#d1495b; --accent2:#2e6f95; --line:#e6e1d8;
    --shadow:0 2px 10px rgba(0,0,0,0.06); --radius:16px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:"Hiragino Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:40px; }
  header{ background:linear-gradient(135deg,#2e6f95,#1a4a63); color:#fff; padding:28px 20px 22px; text-align:center; position:sticky; top:0; z-index:10; box-shadow:var(--shadow); }
  header a.back{ position:absolute; left:16px; top:16px; color:#fff; text-decoration:none; font-size:0.85rem; opacity:0.9; }
  header h1{ margin:0 0 6px; font-size:1.3rem; letter-spacing:0.5px; }
  header .flights{ font-size:0.8rem; opacity:0.92; line-height:1.6; }

  .info-card{ max-width:760px; margin:16px auto 0; padding:0 16px; }
  .info-box{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; font-size:0.82rem; color:var(--sub); line-height:1.8; }
  .info-box b{ color:var(--ink); }
  .info-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; }
  .info-head > span{ flex:1; }
  .info-toggle{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--accent2); font-size:1.05rem; font-weight:700; line-height:22px; text-align:center; cursor:pointer; padding:0; }
  .info-more{ margin-top:8px; }

  nav.tabs{ max-width:760px; margin:20px auto 0; padding:0 16px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--sub); padding:9px 13px; border-radius:12px; font-size:0.78rem; cursor:pointer; text-align:center; line-height:1.4; transition:all 0.15s ease; }
  .tab-btn .d{ font-weight:700; font-size:0.9rem; display:block; color:var(--ink); }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tab-btn.active .d{ color:#fff; }

  main{ max-width:760px; margin:18px auto; padding:0 16px; }
  .day-panel{ display:none; }
  .day-panel.active{ display:block; animation:fadein 0.25s ease; }
  @keyframes fadein{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }

  .day-header{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .day-header .date-big{ font-size:1.5rem; font-weight:800; color:var(--accent); }
  .day-header .title{ font-size:1.02rem; font-weight:700; }
  .day-header .weekday{ font-size:0.8rem; color:var(--sub); background:var(--line); padding:2px 8px; border-radius:10px; }

  .section{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px; }
  .section h3{ margin:0 0 10px; font-size:0.9rem; color:var(--accent2); }

  .spot-list{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .spot-list li a, .spot-list li .nolink{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 12px; background:#faf9f6; border-radius:10px; text-decoration:none; color:inherit; width:100%; }
  .spot-list li a:active{ background:#f0eee7; }
  .spot-order{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:0.7rem; font-weight:700; margin-right:8px; flex:0 0 20px; }
  .spot-name{ font-weight:700; }
  .spot-note{ color:var(--sub); font-size:0.76rem; display:block; margin-top:2px; margin-left:28px; }
  .spot-type{ flex:0 0 auto; font-size:0.7rem; color:#fff; background:var(--accent2); padding:2px 8px; border-radius:8px; }
  .pin{ flex:0 0 auto; font-size:0.9rem; }

  .hotel-opts{ font-size:0.84rem; line-height:1.9; color:var(--ink); }
  .hotel-opts .lead{ font-weight:700; color:var(--accent2); }

  footer{ text-align:center; color:var(--sub); font-size:0.75rem; margin-top:30px; padding:0 20px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← 旅行地圖</a>
  <h1>🇲🇾🇸🇬 新馬五日遊 · 雨林 & 雲頂</h1>
  <div class="flights" id="flight-info"></div>
</header>

<div class="info-card">
  <div class="info-box" id="info-box"></div>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<footer>點擊景點名稱可開啟 Google 地圖 · 行程順序以當地實際安排與領隊說明為準</footer>

<script>
const data = {
  agency: "可樂旅遊 SKC122505BR5B｜新馬超值選～雨林探險園、馬六甲三輪車、雲頂高原纜車、兩晚五星飯店五日",
  flights: {
    outbound: { date:"2025-12-25", weekday:"四", flight:"長榮航空 BR225", route:"桃園→新加坡", depart:"07:25", arrive:"12:05" },
    return:   { date:"2025-12-29", weekday:"一", flight:"長榮航空 BR228", route:"吉隆坡→桃園", depart:"15:25", arrive:"20:05" }
  },
  days: [
    {
      date:"2025-12-25", weekday:"四", title:"新加坡・新山",
      spots:[
        {name:"星耀樟宜 Jewel Changi Airport", type:"地標", note:"世界最高室內瀑布 Rain Vortex、森林谷", q:"Jewel Changi Airport"},
        {name:"魚尾獅公園 Merlion Park", type:"地標", note:"新加坡地標，可同框金沙", q:"Merlion Park Singapore"},
        {name:"Rainforest Wild Asia", type:"雨林探險", note:"Mandai 全新雨林探險園", q:"Rainforest Wild Asia Singapore"},
        {name:"前往新山 Johor Bahru", type:"交通", note:"出關後入住馬來西亞新山"}
      ],
      hotel:"IBIS Styles Johor Iskandar Puteri（新山）"
    },
    {
      date:"2025-12-26", weekday:"五", title:"馬六甲古城",
      spots:[
        {name:"馬六甲 Malacca", type:"世界遺產", note:"世界遺產古城（荷蘭紅屋、雞場街）", q:"Malacca"},
        {name:"三輪車遊古城", type:"體驗", note:"彩繪人力三輪車遊馬六甲古城"},
        {name:"前往波德申 Port Dickson", type:"交通", note:"海濱度假城，當晚住宿"}
      ],
      hotel:"QUEST HOTEL 奎斯特酒店（波德申 Port Dickson）"
    },
    {
      date:"2025-12-27", weekday:"六", title:"吉隆坡市區・雙子星",
      spots:[
        {name:"吉隆坡市中心 Pusat Bandaraya", type:"市區", note:"獨立廣場、蘇丹阿都沙末大廈周邊", q:"Dataran Merdeka Kuala Lumpur"},
        {name:"雙子星 國油雙峰塔 KLCC", type:"地標", note:"Petronas Twin Towers，馬來西亞最著名地標", q:"Petronas Twin Towers"}
      ],
      hotel:"Putrajaya Marriott Hotel 布城萬豪酒店（太子城）"
    },
    {
      date:"2025-12-28", weekday:"日", title:"雲頂高原・黑風洞",
      spots:[
        {name:"雲頂高原 Genting Highlands", type:"高原纜車", note:"搭高原纜車上山，娛樂城與主題樂園", q:"Genting Highlands"},
        {name:"黑風洞 Batu Caves", type:"景點", note:"彩色階梯與印度教石窟廟", q:"Batu Caves"}
      ],
      hotel:"Putrajaya Marriott Hotel 布城萬豪酒店（太子城）"
    },
    {
      date:"2025-12-29", weekday:"一", title:"布城→吉隆坡／桃園",
      spots:[
        {name:"布城粉紅清真寺 Putra Mosque", type:"清真寺", note:"玫瑰色花崗岩清真寺（女性入內需借罩袍）", q:"Putra Mosque Putrajaya"},
        {name:"布城植物園 Putrajaya Botanical Garden", type:"植物園", note:"馬來西亞最大植物園", q:"Putrajaya Botanical Garden"},
        {name:"吉隆坡機場搭機返台", type:"航班", note:"長榮 BR228 吉隆坡15:25→桃園20:05"}
      ],
      hotel:"溫暖的家 🏠"
    }
  ]
};

function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function md(dateStr){ const [,m,d]=dateStr.split("-"); return `${parseInt(m)}/${parseInt(d)}`; }

const f = data.flights;
document.getElementById("flight-info").innerHTML = `
  去程：${f.outbound.date}(${f.outbound.weekday}) ${f.outbound.flight} ${f.outbound.route} ${f.outbound.depart}→${f.outbound.arrive}<br>
  回程：${f.return.date}(${f.return.weekday}) ${f.return.flight} ${f.return.route} ${f.return.depart}→${f.return.arrive}
`;

document.getElementById("info-box").innerHTML = `
  <b>✈️ 長榮航空 BR 直飛</b>：去程 BR225 進新加坡、回程 BR228 出吉隆坡。<br>
  <b>🏨 兩晚五星</b>：布城萬豪酒店 Putrajaya Marriott（太子城）。<br>
  <b>🚲 馬六甲古城三輪車</b>・<b>🚠 雲頂高原纜車</b> 體驗。<br>
  <b>🧳 行李牌顏色</b>：紫色；領隊全程隨團服務。<br>
  <span style="font-size:0.78rem;">${data.agency}</span>
`;

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

data.days.forEach((day, idx) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (idx === 0 ? " active" : "");
  btn.innerHTML = `<span class="d">${md(day.date)}</span>D${idx+1}·${day.weekday}`;
  btn.onclick = () => selectDay(idx);
  tabsEl.appendChild(btn);

  const panel = document.createElement("div");
  panel.className = "day-panel" + (idx === 0 ? " active" : "");
  panel.id = `panel-${idx}`;

  let html = `
    <div class="day-header">
      <span class="date-big">${md(day.date)}</span>
      <span class="title">Day ${idx+1}　${day.title}</span>
      <span class="weekday">週${day.weekday}</span>
    </div>
  `;

  html += `<div class="section"><h3>🗺️ 行程景點</h3><ul class="spot-list">`;
  day.spots.forEach((s, i) => {
    const inner = `
      <span>
        <span class="spot-order">${i+1}</span><span class="spot-name">${s.name}</span>
        ${s.note ? `<span class="spot-note">${s.note}</span>` : ""}
      </span>
      <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
        <span class="spot-type">${s.type}</span>${s.q ? `<span class="pin">📍</span>` : ""}
      </span>`;
    html += `<li>${ s.q ? `<a href="${mapUrl(s.q)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="nolink">${inner}</span>` }</li>`;
  });
  html += `</ul></div>`;

  if (day.meals){
    const selfRe = /自理|機上|—/;
    html += `
      <div class="section"><h3>🍽️ 三餐</h3>
        <div class="meal-row"><span class="meal-tag ${selfRe.test(day.meals.b)?'self':''}">早</span><span>${day.meals.b}</span></div>
        <div class="meal-row"><span class="meal-tag ${selfRe.test(day.meals.l)?'self':''}">午</span><span>${day.meals.l}</span></div>
        <div class="meal-row"><span class="meal-tag ${selfRe.test(day.meals.d)?'self':''}">晚</span><span>${day.meals.d}</span></div>
      </div>`;
  }

  const isHome = /可愛的家|溫暖的家|機上/.test(day.hotel);
  html += `
    <div class="section"><h3>🏨 住宿</h3>
      <div class="hotel-opts"><span class="lead">${isHome ? "" : "飯店："}</span>${day.hotel}</div>
    </div>`;

  panel.innerHTML = html;
  mainEl.appendChild(panel);
});

function selectDay(idx){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active", i===idx));
  document.querySelectorAll(".day-panel").forEach((p,i)=>p.classList.toggle("active", i===idx));
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* 詳細資訊：預設只顯示第一行，其餘可折疊 */
(function collapseInfo(){
  const box=document.getElementById("info-box");
  if(!box) return;
  const kids=Array.from(box.childNodes);
  const brIdx=kids.findIndex(n=>n.nodeName==="BR");
  if(brIdx<0) return;
  const more=document.createElement("div");
  more.className="info-more"; more.hidden=true;
  kids.slice(brIdx+1).forEach(n=>more.appendChild(n));
  box.removeChild(kids[brIdx]);
  const head=document.createElement("div"); head.className="info-head";
  const span=document.createElement("span");
  Array.from(box.childNodes).forEach(n=>span.appendChild(n));
  const btn=document.createElement("button"); btn.className="info-toggle"; btn.type="button"; btn.textContent="＋"; btn.setAttribute("aria-label","展開詳細資訊");
  head.appendChild(span); head.appendChild(btn);
  box.appendChild(head); box.appendChild(more);
  head.addEventListener("click", ()=>{ more.hidden=!more.hidden; btn.textContent=more.hidden?"＋":"－"; });
})();
</script>

</body>
</html>
