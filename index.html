<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Travel Map</title>
<style>
  :root{
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #6b6b6b;
    --accent: #d1495b;
    --accent2: #2e6f95;
    --line: #e6e1d8;
    --ocean: #d7e7ef;
    --land: #cfc6b4;
    --land-active: #e8a0ab;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: 50px;
  }
  header{
    background: linear-gradient(135deg, #2e6f95, #1a4a63);
    color: #fff;
    padding: 26px 20px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  header h1{ margin:0 0 4px; font-size: 1.4rem; letter-spacing: 1px; }
  header .sub{ font-size: 0.8rem; opacity: 0.9; }

  .wrap{ max-width: 860px; margin: 0 auto; padding: 0 16px; }

  .toggle{
    display:flex;
    gap:8px;
    justify-content:center;
    margin: 18px auto 6px;
  }
  .toggle button{
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--sub);
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle button.active{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
    font-weight: 700;
  }

  .view{ display:none; animation: fade 0.25s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }

  /* ---- map ---- */
  .map-card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-top: 10px;
  }
  .map-hint{
    text-align:center;
    font-size:0.8rem;
    color: var(--sub);
    margin: 4px 0 10px;
  }
  /* ---- 3D globe ---- */
  #globeViz{ width:100%; height:62vh; max-height:520px; min-height:300px; cursor:grab; }
  #globeViz:active{ cursor:grabbing; }
  #globeViz canvas{ display:block; outline:none; }
  .globe-note{ text-align:center; font-size:0.78rem; color:var(--sub); margin-top:8px; }

  /* ---- list ---- */
  .filter-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin: 14px 0 4px;
    min-height: 30px;
  }
  .filter-chip{
    background: var(--accent2);
    color:#fff;
    border:none;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .filter-label{ font-size:0.82rem; color:var(--sub); }

  .trip-list{ display:grid; gap:12px; margin-top: 8px; }
  .trip-card{
    display:flex;
    align-items:stretch;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
    text-decoration:none;
    color: inherit;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .trip-card:active{ transform: scale(0.99); }
  .trip-cover{
    flex: 0 0 84px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 2.4rem;
    background: linear-gradient(135deg, #2e6f95, #1a4a63);
  }
  .trip-body{ flex:1; padding: 12px 14px; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .trip-title{ font-size: 1.02rem; font-weight: 700; }
  .trip-meta{ font-size: 0.8rem; color: var(--sub); }
  .trip-tags{ display:flex; gap:6px; margin-top:4px; }
  .tag{
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 8px;
    background: #eef4f7;
    color: var(--accent2);
  }
  .tag.cont{ background:#fdeef0; color:var(--accent); }
  .trip-chev{ align-self:center; padding-right: 14px; color: var(--sub); font-size:1.2rem; }

  .empty{
    text-align:center;
    color: var(--sub);
    font-size: 0.9rem;
    padding: 36px 20px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  footer{ text-align:center; color: var(--sub); font-size: 0.75rem; margin-top: 26px; padding: 0 20px; }
</style>
</head>
<body>

<header>
  <h1>🌏 My Travel Map</h1>
</header>

<div class="wrap">
  <div class="toggle">
    <button id="btn-map" class="active" onclick="setView('map')">🗺️ 地圖</button>
    <button id="btn-list" onclick="setView('list')">📋 清單</button>
  </div>

  <!-- MAP VIEW -->
  <div id="view-map" class="view active">
    <div class="map-card">
      <div id="globeViz"></div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list" class="view">
    <div class="filter-bar" id="filter-bar"></div>
    <div class="trip-list" id="trip-list"></div>
  </div>
</div>


<script src="lib/globe.gl.min.js"></script>
<script>
/* ===== 旅程清單：未來新增旅程只要在這裡加一筆 ===== */
const continents = {
  americas: { name: "Americas", ax: 228, ay: 114 },
  europe: { name: "Europe", ax: 547, ay: 75 },
  africa: { name: "Africa", ax: 556, ay: 222 },
  asia: { name: "Asia", ax: 764, ay: 100 },
  oceania: { name: "Oceania", ax: 872, ay: 300 }
};

const trips = [
  {
    title: "東京五日遊",
    country: "日本",
    flag: "🇯🇵",
    continent: "asia",
    iso: ["JPN"],
    start: "2026-07-18",
    end: "2026-07-22",
    url: "japan-tokyo-202607.html"
  },
  {
    title: "濟州島三日遊",
    country: "韓國",
    flag: "🇰🇷",
    continent: "asia",
    iso: ["KOR"],
    start: "2026-10-31",
    end: "2026-11-02",
    url: "korea-jeju-202610.html"
  },
  {
    title: "德國 瑞士十日遊",
    country: "德國・瑞士",
    flag: "🇩🇪🇨🇭",
    continent: "europe",
    iso: ["DEU", "CHE"],
    start: "2025-03-02",
    end: "2025-03-11",
    url: "germany-swiss-202503.html"
  },
  {
    title: "美西八日遊",
    country: "美國",
    flag: "🇺🇸",
    continent: "americas",
    iso: ["USA"],
    start: "2026-03-30",
    end: "2026-04-06",
    url: "usa-west-202603.html"
  },
  {
    title: "新馬五日遊",
    country: "馬來西亞・新加坡",
    flag: "🇲🇾🇸🇬",
    continent: "asia",
    iso: ["MYS"],
    start: "2025-12-25",
    end: "2025-12-29",
    url: "malaysia-singapore-202510.html"
  }
  /* 範例：
  { title:"首爾自由行", country:"韓國", flag:"🇰🇷", continent:"asia", iso:["KOR"],
    start:"2026-10-01", end:"2026-10-05", url:"korea-seoul-202610.html" },
  */
];

/* ===== 工具 ===== */
function fmtRange(start, end){
  const s = start.split("-"), e = end.split("-");
  const days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
  const sameMonth = s[1] === e[1] && s[0] === e[0];
  const left = `${s[0]}/${s[1]}/${s[2]}`;
  const right = sameMonth ? `${e[2]}` : `${e[1]}/${e[2]}`;
  return `${left} – ${right} · ${days}天`;
}
function tripCount(key){ return trips.filter(t => t.continent === key).length; }

/* ===== 3D 地球儀（globe.gl / WebGL；函式庫已內建於 repo，離線可用） ===== */
const A3_ZH = { JPN:"日本", KOR:"韓國", DEU:"德國", CHE:"瑞士", USA:"美國", MYS:"馬來西亞", SGP:"新加坡" };
const visitedIso = new Set();
trips.forEach(t => (t.iso || []).forEach(code => visitedIso.add(code)));

let globe = null, globeReady = false;
function sizeGlobe(){
  if(!globe) return;
  const el = document.getElementById("globeViz");
  if(el && el.clientWidth) globe.width(el.clientWidth).height(el.clientHeight);
}
function initGlobe(){
  if(globeReady || typeof Globe === "undefined") return;
  globeReady = true;
  fetch("countries.geojson").then(r => r.json()).then(geo => {
    globe = Globe()(document.getElementById("globeViz"))
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor("#9ec7de")
      .atmosphereAltitude(0.18)
      .polygonsData(geo.features)
      .polygonCapColor(f => visitedIso.has(f.properties.a3) ? "#2e6f95" : "#cfc6b4")
      .polygonSideColor(() => "rgba(120,110,90,0.25)")
      .polygonStrokeColor(() => "#ffffff")
      .polygonAltitude(f => visitedIso.has(f.properties.a3) ? 0.05 : 0.008)
      .polygonLabel(f => `<div style="font:600 12px sans-serif;color:#2b2b2b;background:#fff;padding:3px 7px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)">${f.properties.name}${visitedIso.has(f.properties.a3) ? " ✅" : ""}</div>`)
      .onPolygonClick(f => {
        const a3 = f.properties.a3;
        if (trips.some(t => (t.iso || []).includes(a3))) {   // only countries with a trip
          currentFilter = { a3, label: A3_ZH[a3] || f.properties.name };
          setView("list");
        }
      });
    try { globe.globeMaterial().color.set("#cfe3ef"); } catch(e){}
    sizeGlobe();
    const c = globe.controls();
    c.autoRotate = true; c.autoRotateSpeed = 0.55;
    c.enablePan = false; c.minDistance = 150; c.maxDistance = 500;
    globe.pointOfView({ lat: 25, lng: 110, altitude: 2.2 }, 0);
  });
}
window.addEventListener("resize", sizeGlobe);

/* ===== 清單 ===== */
let currentFilter = null;
function renderList(){
  const bar = document.getElementById("filter-bar");
  const list = document.getElementById("trip-list");
  let items = trips.slice().sort((a,b) => b.start.localeCompare(a.start));
  if (currentFilter) items = items.filter(t => (t.iso || []).includes(currentFilter.a3));

  bar.innerHTML = currentFilter
    ? `<span class="filter-label">篩選：</span><button class="filter-chip" onclick="clearFilter()">📍 ${currentFilter.label} ✕</button>`
    : `<span class="filter-label">全部旅程 · 依日期排序</span>`;

  if (!items.length) {
    list.innerHTML = `<div class="empty">此國家尚無旅程，敬請期待 ✈️</div>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <a class="trip-card" href="${t.url}">
      <div class="trip-cover">${t.flag}</div>
      <div class="trip-body">
        <div class="trip-title">${t.title}</div>
        <div class="trip-meta">${fmtRange(t.start, t.end)}</div>
        <div class="trip-tags">
          <span class="tag">${t.flag} ${t.country}</span>
          <span class="tag cont">${continents[t.continent].name}</span>
        </div>
      </div>
      <div class="trip-chev">›</div>
    </a>
  `).join("");
}
function clearFilter(){ currentFilter = null; renderList(); }

/* ===== 檢視切換 ===== */
function setView(v){
  document.getElementById("btn-map").classList.toggle("active", v === "map");
  document.getElementById("btn-list").classList.toggle("active", v === "list");
  document.getElementById("view-map").classList.toggle("active", v === "map");
  document.getElementById("view-list").classList.toggle("active", v === "list");
  if (v === "list") renderList();
  if (v === "map"){ initGlobe(); setTimeout(sizeGlobe, 60); window.scrollTo({ top: 0, behavior: "smooth" }); }
}

renderList();

/* ===== 首次載入檢視：預設地圖（地球儀） ===== */
initGlobe();
</script>

</body>
</html>
