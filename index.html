<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Travel Map</title>
<style>
  :root{
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #6b6b6b;
    --accent: #d1495b;
    --accent2: #2e6f95;
    --line: #e6e1d8;
    --ocean: #d7e7ef;
    --land: #cfc6b4;
    --land-active: #e8a0ab;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: 50px;
  }
  header{
    background: linear-gradient(135deg, #2e6f95, #1a4a63);
    color: #fff;
    padding: 26px 20px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  header h1{ margin:0 0 4px; font-size: 1.4rem; letter-spacing: 1px; }
  header .sub{ font-size: 0.8rem; opacity: 0.9; }

  .wrap{ max-width: 860px; margin: 0 auto; padding: 0 16px; }

  .toggle{
    display:flex;
    gap:8px;
    justify-content:center;
    margin: 18px auto 6px;
  }
  .toggle button{
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--sub);
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle button.active{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
    font-weight: 700;
  }

  .view{ display:none; animation: fade 0.25s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }

  /* ---- map ---- */
  .map-card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-top: 10px;
  }
  .map-hint{
    text-align:center;
    font-size:0.8rem;
    color: var(--sub);
    margin: 4px 0 10px;
  }
  svg.worldmap{ width:100%; height:auto; display:block; touch-action:none; cursor:grab; }
  svg.worldmap:active{ cursor:grabbing; }
  .continent{
    fill: var(--land);
    stroke: #fff;
    stroke-width: 0.5;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill 0.15s ease;
  }
  .continent:hover{ fill: #bcae95; }
  /* visited-country overlay (only countries actually visited are coloured) */
  .country{ fill: var(--accent); stroke:#fff; stroke-width:0.4; stroke-linejoin:round; pointer-events:none; }
  .country:not(.visited){ display:none; }
  .clabel{
    font-size: 15px;
    font-weight: 800;
    fill: #4a4335;
    pointer-events: none;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(255,255,255,0.9);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .clabel.on{ fill:#fff; stroke: rgba(0,0,0,0.3); }
  .cbadge-c{ fill:#fff; stroke: var(--accent); stroke-width:2; pointer-events:none; }
  .cbadge-t{ font-size:15px; font-weight:800; fill: var(--accent); text-anchor:middle; pointer-events:none; }

  /* ---- list ---- */
  .filter-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin: 14px 0 4px;
    min-height: 30px;
  }
  .filter-chip{
    background: var(--accent2);
    color:#fff;
    border:none;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .filter-label{ font-size:0.82rem; color:var(--sub); }

  .trip-list{ display:grid; gap:12px; margin-top: 8px; }
  .trip-card{
    display:flex;
    align-items:stretch;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
    text-decoration:none;
    color: inherit;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .trip-card:active{ transform: scale(0.99); }
  .trip-cover{
    flex: 0 0 84px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 2.4rem;
    background: linear-gradient(135deg, #2e6f95, #1a4a63);
  }
  .trip-body{ flex:1; padding: 12px 14px; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .trip-title{ font-size: 1.02rem; font-weight: 700; }
  .trip-meta{ font-size: 0.8rem; color: var(--sub); }
  .trip-tags{ display:flex; gap:6px; margin-top:4px; }
  .tag{
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 8px;
    background: #eef4f7;
    color: var(--accent2);
  }
  .tag.cont{ background:#fdeef0; color:var(--accent); }
  .trip-chev{ align-self:center; padding-right: 14px; color: var(--sub); font-size:1.2rem; }

  .empty{
    text-align:center;
    color: var(--sub);
    font-size: 0.9rem;
    padding: 36px 20px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  footer{ text-align:center; color: var(--sub); font-size: 0.75rem; margin-top: 26px; padding: 0 20px; }
</style>
</head>
<body>

<header>
  <h1>🌏 My Travel Map</h1>
</header>

<div class="wrap">
  <div class="toggle">
    <button id="btn-map" class="active" onclick="setView('map')">🗺️ 地圖</button>
    <button id="btn-list" onclick="setView('list')">📋 清單</button>
  </div>

<script>
/* ===== 旅程清單：未來新增旅程只要在這裡加一筆 ===== */
const continents = {
  americas: { name: "Americas", ax: 228, ay: 114 },
  europe: { name: "Europe", ax: 547, ay: 75 },
  africa: { name: "Africa", ax: 556, ay: 222 },
  asia: { name: "Asia", ax: 764, ay: 100 },
  oceania: { name: "Oceania", ax: 872, ay: 300 }
};

const trips = [
  {
    title: "東京五日遊",
    country: "日本",
    flag: "🇯🇵",
    continent: "asia",
    iso: ["JPN"],
    start: "2026-07-18",
    end: "2026-07-22",
    url: "japan-tokyo-202607.html"
  },
  {
    title: "濟州島三日遊",
    country: "韓國",
    flag: "🇰🇷",
    continent: "asia",
    iso: ["KOR"],
    start: "2026-10-31",
    end: "2026-11-02",
    url: "korea-jeju-202610.html"
  },
  {
    title: "德國 瑞士十日遊",
    country: "德國・瑞士",
    flag: "🇩🇪🇨🇭",
    continent: "europe",
    iso: ["DEU", "CHE"],
    start: "2025-03-02",
    end: "2025-03-11",
    url: "germany-swiss-202503.html"
  },
  {
    title: "美西八日遊",
    country: "美國",
    flag: "🇺🇸",
    continent: "americas",
    iso: ["USA"],
    start: "2026-03-30",
    end: "2026-04-06",
    url: "usa-west-202603.html"
  },
  {
    title: "新馬五日遊",
    country: "馬來西亞・新加坡",
    flag: "🇲🇾🇸🇬",
    continent: "asia",
    iso: ["MYS"],
    start: "2025-12-25",
    end: "2025-12-29",
    url: "malaysia-singapore-202510.html"
  }
  /* 範例：
  { title:"首爾自由行", country:"韓國", flag:"🇰🇷", continent:"asia", iso:["KOR"],
    start:"2026-10-01", end:"2026-10-05", url:"korea-seoul-202610.html" },
  */
];

/* ===== 工具 ===== */
function fmtRange(start, end){
  const s = start.split("-"), e = end.split("-");
  const days = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
  const sameMonth = s[1] === e[1] && s[0] === e[0];
  const left = `${s[0]}/${s[1]}/${s[2]}`;
  const right = sameMonth ? `${e[2]}` : `${e[1]}/${e[2]}`;
  return `${left} – ${right} · ${days}天`;
}
function tripCount(key){ return trips.filter(t => t.continent === key).length; }

/* ===== 地圖：標記 + 點擊 ===== */
let mapWasDragged = false;   // set true while panning so a drag isn't treated as a tap
const badgesG = document.getElementById("badges");
Object.keys(continents).forEach(key => {
  const count = tripCount(key);
  const path = document.querySelector(`.continent[data-continent="${key}"]`);
  const label = document.querySelector(`.clabel[data-lab="${key}"]`);
  if (count > 0) {
    const c = continents[key];
    // place the count badge to the RIGHT of the label (so it never covers the name)
    let halfW = 0;
    try { halfW = label.getComputedTextLength() / 2; } catch (e) {}
    if (!halfW) halfW = c.name.length * 4.6;      // fallback when hidden / unsupported
    const bx = c.ax + halfW + 20;                 // 12px radius + 8px gap
    const by = c.ay - 5;                          // vertically centred on the label
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("class", "cbadge-c");
    circle.setAttribute("cx", bx); circle.setAttribute("cy", by); circle.setAttribute("r", 12);
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("class", "cbadge-t");
    txt.setAttribute("x", bx); txt.setAttribute("y", by + 5);
    txt.textContent = count;
    badgesG.appendChild(circle); badgesG.appendChild(txt);
  }
  path.addEventListener("click", () => {
    if (mapWasDragged) return;                   // ignore clicks that were really pans
    currentFilter = key; setView("list");
  });
});

// colour only the countries actually visited (overlay on top of the grey continents)
const visitedIso = new Set();
trips.forEach(t => (t.iso || []).forEach(code => visitedIso.add(code)));
document.querySelectorAll(".country").forEach(p => {
  if (visitedIso.has(p.dataset.iso)) p.classList.add("visited");
});

/* ===== 清單 ===== */
let currentFilter = null;
function renderList(){
  const bar = document.getElementById("filter-bar");
  const list = document.getElementById("trip-list");
  let items = trips.slice().sort((a,b) => b.start.localeCompare(a.start));
  if (currentFilter) items = items.filter(t => t.continent === currentFilter);

  bar.innerHTML = currentFilter
    ? `<span class="filter-label">篩選：</span><button class="filter-chip" onclick="clearFilter()">🌏 ${continents[currentFilter].name} ✕</button>`
    : `<span class="filter-label">全部旅程 · 依日期排序</span>`;

  if (!items.length) {
    list.innerHTML = `<div class="empty">此大洲尚無旅程，敬請期待 ✈️</div>`;
    return;
  }
  list.innerHTML = items.map(t => `
    <a class="trip-card" href="${t.url}">
      <div class="trip-cover">${t.flag}</div>
      <div class="trip-body">
        <div class="trip-title">${t.title}</div>
        <div class="trip-meta">${fmtRange(t.start, t.end)}</div>
        <div class="trip-tags">
          <span class="tag">${t.flag} ${t.country}</span>
          <span class="tag cont">${continents[t.continent].name}</span>
        </div>
      </div>
      <div class="trip-chev">›</div>
    </a>
  `).join("");
}
function clearFilter(){ currentFilter = null; renderList(); }

/* ===== 檢視切換 ===== */
function setView(v){
  document.getElementById("btn-map").classList.toggle("active", v === "map");
  document.getElementById("btn-list").classList.toggle("active", v === "list");
  document.getElementById("view-map").classList.toggle("active", v === "map");
  document.getElementById("view-list").classList.toggle("active", v === "list");
  if (v === "list") renderList();
  if (v === "map") window.scrollTo({ top: 0, behavior: "smooth" });
}

renderList();

/* ===== 地圖：雙指縮放 + 拖曳平移（純前端，離線可用） ===== */
(function enablePanZoom(){
  const svg = document.querySelector("svg.worldmap");
  if (!svg) return;
  const BASE = { x:0, y:0, w:1000, h:386 };   // full-world viewBox
  const MIN_W = 160;                            // most zoomed-in (≈6x)
  let vb = { ...BASE };
  const pointers = new Map();                   // active touch/mouse points
  let last = null, startDist = 0, startVB = null, moved = 0;

  function apply(){ svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
  function clamp(){
    vb.w = Math.min(BASE.w, Math.max(MIN_W, vb.w));
    vb.h = vb.w * (BASE.h / BASE.w);
    vb.x = Math.min(BASE.w - vb.w, Math.max(0, vb.x));
    vb.y = Math.min(BASE.h - vb.h, Math.max(0, vb.y));
  }
  // client px -> svg units
  function toSvg(clientX, clientY){
    const r = svg.getBoundingClientRect();
    return { x: vb.x + (clientX - r.left) / r.width * vb.w,
             y: vb.y + (clientY - r.top) / r.height * vb.h };
  }
  function zoomAt(clientX, clientY, factor){
    const p = toSvg(clientX, clientY);
    vb.w = vb.w / factor;
    clamp();
    // keep the point under the cursor fixed
    const r = svg.getBoundingClientRect();
    vb.x = p.x - (clientX - r.left) / r.width * vb.w;
    vb.y = p.y - (clientY - r.top) / r.height * vb.h;
    clamp(); apply();
  }

  svg.addEventListener("pointerdown", e => {
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    moved = 0; mapWasDragged = false;
    if (pointers.size === 1){ last = { x:e.clientX, y:e.clientY }; }
    else if (pointers.size === 2){
      const pts = [...pointers.values()];
      startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      startVB = { ...vb };
    }
  });
  svg.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    const pts = [...pointers.values()];
    if (pointers.size >= 2){                     // pinch zoom
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = { x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2 };
      if (startDist > 0){
        vb = { ...startVB };
        zoomAt(mid.x, mid.y, dist / startDist);
      }
      mapWasDragged = true;
    } else if (last){                            // single-finger / mouse drag = pan
      const r = svg.getBoundingClientRect();
      const dx = (e.clientX - last.x) / r.width * vb.w;
      const dy = (e.clientY - last.y) / r.height * vb.h;
      moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y);
      if (moved > 6) mapWasDragged = true;
      vb.x -= dx; vb.y -= dy; clamp(); apply();
      last = { x:e.clientX, y:e.clientY };
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) startDist = 0;
    if (pointers.size === 1){ const p = [...pointers.values()][0]; last = { x:p.x, y:p.y }; }
    if (pointers.size === 0){ last = null; setTimeout(() => { mapWasDragged = false; }, 50); }
  }
  svg.addEventListener("pointerup", endPointer);
  svg.addEventListener("pointercancel", endPointer);
  // mouse wheel zoom (desktop)
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.2 : 1/1.2);
  }, { passive:false });
  // double-tap / double-click → reset to full world
  svg.addEventListener("dblclick", e => { e.preventDefault(); vb = { ...BASE }; apply(); });
})();

/* ===== 手機預設顯示「清單」（地圖仍可一鍵切換） ===== */
if (window.matchMedia("(max-width: 640px)").matches) setView("list");
</script>

</body>
</html>
