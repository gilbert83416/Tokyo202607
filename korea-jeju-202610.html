<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>濟州島三日遊 10/31-11/2</title>
<style>
  :root{
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #2b2b2b;
    --sub: #6b6b6b;
    --accent: #d1495b;
    --accent2: #2e6f95;
    --line: #e6e1d8;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Hiragino Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: 40px;
  }
  header{
    background: linear-gradient(135deg, #2e6f95, #1a4a63);
    color: #fff;
    padding: 28px 20px 22px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  header a.back{ position:absolute;left:16px;top:16px;color:#fff;text-decoration:none;font-size:0.85rem;opacity:0.9; }
  header h1{ margin:0 0 6px; font-size: 1.35rem; letter-spacing: 0.5px; }
  header .flights{ font-size: 0.8rem; opacity: 0.92; line-height: 1.6; }

  .info-card{ max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
  .info-box{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    font-size: 0.82rem;
    color: var(--sub);
    line-height: 1.8;
  }
  .info-box b{ color: var(--ink); }
  .info-box a{ color: var(--accent2); }

  nav.tabs{
    max-width: 720px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--sub);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 0.8rem;
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    transition: all 0.15s ease;
  }
  .tab-btn .d{ font-weight:700; font-size:0.9rem; display:block; color: var(--ink);}
  .tab-btn.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .tab-btn.active .d{ color:#fff; }

  main{ max-width: 720px; margin: 18px auto; padding: 0 16px; }
  .day-panel{ display:none; }
  .day-panel.active{ display:block; animation: fadein 0.25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .day-header{ display:flex; align-items:baseline; gap:10px; margin-bottom: 14px; flex-wrap:wrap; }
  .day-header .date-big{ font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  .day-header .title{ font-size: 1.05rem; font-weight: 700; }
  .day-header .weekday{ font-size: 0.8rem; color: var(--sub); background: var(--line); padding: 2px 8px; border-radius: 10px; }

  .section{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .section h3{ margin: 0 0 10px; font-size: 0.9rem; color: var(--accent2); }

  .spot-list{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .spot-list li a, .spot-list li .nolink{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding: 11px 12px; background:#faf9f6; border-radius:10px;
    text-decoration:none; color:inherit; width:100%;
  }
  .spot-list li a:active{ background:#f0eee7; }
  .spot-order{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    color:#fff; font-size:0.7rem; font-weight:700; margin-right:8px; flex:0 0 20px;
  }
  .spot-name{ font-weight:700; }
  .spot-note{ color:var(--sub); font-size:0.76rem; display:block; margin-top:2px; margin-left:28px; }
  .spot-type{ flex:0 0 auto; font-size:0.7rem; color:#fff; background:var(--accent2); padding:2px 8px; border-radius:8px; }
  .pin{ flex:0 0 auto; font-size:0.9rem; }

  .meal-row{ display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:0.86rem; }
  .meal-row:last-child{ border-bottom:none; }
  .meal-tag{ flex:0 0 42px; font-weight:700; color:var(--accent); }
  .meal-tag.self{ color:var(--sub); }

  .hotel-opts{ font-size:0.84rem; line-height:1.9; color:var(--ink); }
  .hotel-opts .lead{ font-weight:700; color:var(--accent2); }

  footer{ text-align:center; color: var(--sub); font-size: 0.75rem; margin-top: 30px; padding: 0 20px; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← 旅行地圖</a>
  <h1 id="trip-title">濟州島三日遊</h1>
  <div class="flights" id="flight-info"></div>
</header>

<div class="info-card">
  <div class="info-box" id="info-box"></div>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<footer>點擊景點名稱可開啟 Google 地圖 · 行程順序以當地實際安排與領隊說明為準</footer>

<script>
const data = {
  title: "2026 濟州島三日遊",
  agency: "可樂旅遊 OCF103103ZE6",
  flights: {
    outbound: { date: "2026-10-31", weekday:"六", flight: "易斯達航空 ZE886", route: "桃園→濟州", depart: "03:05", arrive: "06:05" },
    return:   { date: "2026-11-02", weekday:"一", flight: "易斯達航空 ZE885", route: "濟州→桃園", depart: "22:40", arrive: "00:05(+1)" }
  },
  days: [
    {
      date: "2026-10-31", weekday: "六", title: "桃園／濟州・市區夜市",
      spots: [
        { name: "海水溫泉汗蒸幕", type:"汗蒸幕", note:"含毛巾+專用衣服，吸收海洋礦物質消除疲勞" },
        { name: "倫敦貝果博物館 London Bagel Museum", type:"打卡", note:"超人氣排隊名店，英國工業風＋海景", q:"London Bagel Museum 제주" },
        { name: "松堂童話村（萌趣吉卜力＋典藏星巴克）", type:"打卡", note:"濟州東方童話主題村", q:"제주 송당 동화마을" },
        { name: "東門傳統市場／夜市", type:"美食", note:"美食大探索，停留約1～1.5小時", q:"동문시장 제주" }
      ],
      meals: { breakfast:"機上不供餐（廉航）", lunch:"無限放題～韓式烤(豬/牛)肉＋炒年糕＋燉雞＋義大利麵", dinner:"發韓幣 6,000 自理" },
      hotel: "濟州商旅 SIMS HOTEL／BLACK SANDS／ODRI INN／AMOUREX／NEW KOREA／THE BEST JEJU 或同級"
    },
    {
      date: "2026-11-01", weekday: "日", title: "漢拏山賞楓・山茶花之丘",
      spots: [
        { name: "漢拏山 1100 高地", type:"賞楓", note:"秋季賞楓／冬季賞雪，比市區低6-10度請保暖；楓況視天候", q:"한라산 1100고지" },
        { name: "山茶花之丘", type:"打卡", note:"IG熱門，世界最大山茶花庭園", q:"카멜리아힐 제주" },
        { name: "O'sulloc 雪綠茶博物館", type:"景點", note:"李敏鎬、潤娥廣告拍攝地", q:"오설록 티뮤지엄" },
        { name: "innisfree 玻璃小屋", type:"體驗", note:"緊鄰雪綠茶園，親近大自然的休憩館", q:"이니스프리 제주하우스" },
        { name: "龍淵峽谷", type:"自然", note:"溪谷奇岩與碧綠潭水", q:"용연 제주" },
        { name: "龍頭巖", type:"地標", note:"龍頭形海岸岩石", q:"용두암" }
      ],
      meals: { breakfast:"飯店簡易早餐", lunch:"嫩豆腐鍋＋養生紫米石鍋飯＋季節小菜", dinner:"鐵桶鍋蓋一隻雞～燉全雞＋泡麵＋炒飯＋起司蒸蛋（4人一份）" },
      hotel: "濟州商旅 SIMS HOTEL／BLACK SANDS／ODRI INN／BENIKEA／JEJU IN／THE BEST JEJU 或同級"
    },
    {
      date: "2026-11-02", weekday: "一", title: "彩虹海岸・購物・濟州／桃園",
      spots: [
        { name: "道頭峰", type:"散策", note:"彩虹海岸道路散策", q:"도두봉 제주" },
        { name: "Marina K.C 彩妝名品", type:"購物", note:"贈每人精美小禮物一份" },
        { name: "E-MART 超市", type:"購物", note:"停留約40～60分；每月第2週五、第4週六公休改農協超市", q:"이마트 제주점" },
        { name: "漢潭海岸散步路（涯月咖啡街）", type:"打卡", note:"停留約30～40分", q:"한담해안산책로" },
        { name: "蓮洞購物商圈", type:"購物", note:"停留約40～60分", q:"제주 연동 누웨마루거리" }
      ],
      meals: { breakfast:"飯店簡易早餐", lunch:"JOMARU 澎派海鮮陸鍋（章魚、花蟹、貝類、蝦、豬排骨）", dinner:"機上不供餐（廉航）" },
      hotel: "回溫暖的家 🏠"
    }
  ]
};

function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function md(dateStr){ const [,m,d]=dateStr.split("-"); return `${parseInt(m)}/${parseInt(d)}`; }

document.getElementById("trip-title").textContent = data.title.replace(/^2026 /, "") ;
document.title = data.title.replace("2026 ","") + " 10/31-11/2";

const f = data.flights;
document.getElementById("flight-info").innerHTML = `
  去程：${f.outbound.date}(${f.outbound.weekday}) ${f.outbound.flight} ${f.outbound.route} ${f.outbound.depart}→${f.outbound.arrive}<br>
  回程：${f.return.date}(${f.return.weekday}) ${f.return.flight} ${f.return.route} ${f.return.depart}→${f.return.arrive}
`;

document.getElementById("info-box").innerHTML = `
  <b>✈️ 易斯達航空 ZE（廉航）</b>：早去晚回玩足三天，來回機上不供餐、不提供水，可自備味道不重的餐食。<br>
  <b>💺 座位</b>：團體座位由航空公司於機場統一劃位，無法預選。<br>
  <b>🧳 行李</b>：托運 20kg（不限件數）／手提 10kg 1件（55×40×20cm）。<br>
  <b>🪪 入境</b>：入境前72小時內申辦韓國電子入境卡 <a href="https://www.e-arrivalcard.go.kr/" target="_blank" rel="noopener">e-Arrival Card</a>（免費）。<br>
  <b>💰 小費</b>：領隊＋導遊＋司機 NT$300／日 × 3天 = NT$900。<br>
  <span style="font-size:0.78rem;">${data.agency}</span>
`;

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

data.days.forEach((day, idx) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (idx === 0 ? " active" : "");
  btn.innerHTML = `<span class="d">${md(day.date)}</span>D${idx+1}·${day.weekday}`;
  btn.onclick = () => selectDay(idx);
  tabsEl.appendChild(btn);

  const panel = document.createElement("div");
  panel.className = "day-panel" + (idx === 0 ? " active" : "");
  panel.id = `panel-${idx}`;

  let html = `
    <div class="day-header">
      <span class="date-big">${md(day.date)}</span>
      <span class="title">Day ${idx+1}　${day.title}</span>
      <span class="weekday">週${day.weekday}</span>
    </div>
  `;

  // spots
  html += `<div class="section"><h3>🗺️ 行程景點</h3><ul class="spot-list">`;
  day.spots.forEach((s, i) => {
    const inner = `
      <span>
        <span class="spot-order">${i+1}</span><span class="spot-name">${s.name}</span>
        ${s.note ? `<span class="spot-note">${s.note}</span>` : ""}
      </span>
      <span style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
        <span class="spot-type">${s.type}</span>${s.q ? `<span class="pin">📍</span>` : ""}
      </span>`;
    html += `<li>${ s.q
      ? `<a href="${mapUrl(s.q)}" target="_blank" rel="noopener">${inner}</a>`
      : `<span class="nolink">${inner}</span>` }</li>`;
  });
  html += `</ul></div>`;

  // meals
  html += `
    <div class="section"><h3>🍽️ 三餐</h3>
      <div class="meal-row"><span class="meal-tag">早</span><span>${day.meals.breakfast}</span></div>
      <div class="meal-row"><span class="meal-tag">午</span><span>${day.meals.lunch}</span></div>
      <div class="meal-row"><span class="meal-tag ${/自理|不供餐/.test(day.meals.dinner)?'self':''}">晚</span><span>${day.meals.dinner}</span></div>
    </div>`;

  // hotel
  html += `
    <div class="section"><h3>🏨 住宿</h3>
      <div class="hotel-opts"><span class="lead">${idx === data.days.length-1 ? "" : "參考飯店："}</span>${day.hotel}</div>
    </div>`;

  panel.innerHTML = html;
  mainEl.appendChild(panel);
});

function selectDay(idx){
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active", i===idx));
  document.querySelectorAll(".day-panel").forEach((p,i)=>p.classList.toggle("active", i===idx));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>

</body>
</html>
